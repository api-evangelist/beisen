name: Beisen
description: 'Beisen (北森) is a China-based enterprise software company and the country''s
  largest cloud-native Human Capital Management (HCM) and talent-management SaaS provider,
  delivered through its iTalent platform. Its integrated suite spans recruiting and
  applicant tracking, talent assessment and psychometric testing, performance and goals
  (OKR), core HR and personnel records, compensation, learning and development, and
  succession planning for large enterprises. Beisen operates an Open Platform (open.italent.cn)
  that lets partners and customers integrate HR data and workflows into the iTalent
  ecosystem via web APIs. The company is publicly listed on the Hong Kong Stock Exchange
  (9669) and was surfaced to the API Evangelist network as a SoftBank Vision Fund portfolio
  company.'
